<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Rezervácia pripravená</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333; max-width: 560px; margin: 0 auto; padding: 24px;">
  <h2 style="color: #2C5F7C;">Knižnica ISK</h2>
  <p>Dobrý deň, <strong th:text="${firstName}">Čitateľ</strong>,</p>
  <p>vaša rezervovaná kniha je pripravená na vyzdvihnutie:</p>
  <div style="background: #F7F6F4; border-left: 4px solid #2C5F7C; padding: 12px 16px; margin: 16px 0;">
    <div style="font-size: 16px; font-weight: 500;" th:text="${bookTitle}">Názov knihy</div>
    <div style="color: #6B6B6B; font-size: 13px;" th:text="${bookAuthor}">Autor</div>
  </div>
  <p>Knihu si môžete vyzdvihnúť počas otváracích hodín v priebehu nasledujúcich <strong>3 dní</strong>. Po tomto termíne rezervácia automaticky vyprší.</p>
  <p style="color: #6B6B6B; font-size: 12px; margin-top: 32px;">Ďakujeme,<br/>Knižnica ISK</p>
</body>
</html>
